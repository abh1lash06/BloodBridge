spring.application.name=BloodBridgeBackend

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/bloodbridge?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:abhilash@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.security=INFO

app.jwt.secret=${JWT_SECRET:BloodBridgeDevelopmentSecretKeyChangeThisBeforeProduction123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html